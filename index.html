<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Status Board</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap"><p class="eyebrow">System health</p><h1>Service Status Board</h1><p>Operational visibility for a demonstration service stack.</p></div></header><main class="wrap"><section class="panel"><h2>Current overview</h2><p id="overall" role="status" aria-live="polite"></p><div id="services" class="grid"></div></section><section class="panel"><h2>Report an incident</h2><form id="incident-form"><label>Title<input name="title" required minlength="3"></label><label>Service<select name="serviceId" id="incident-service"></select></label><label>Severity<select name="severity"><option value="minor">Minor</option><option value="major">Major</option><option value="critical">Critical</option></select></label><button>Record incident</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>Incident history</h2><div id="incidents"></div></section><p class="note">Demo data only. Statuses are manually updated in this browser, not measured from live services.</p></main><script type="module" src="app.js"></script></body></html>
